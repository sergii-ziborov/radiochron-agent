name: Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Bluetooth build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - name: Enforce Tokio-free agent boundary
        run: >-
          python -c "import json,subprocess;
          names={p['name'] for p in json.loads(subprocess.check_output(['cargo','metadata','--locked','--format-version','1']))['packages']};
          bad=sorted(names & {'tokio','btleplug','futures'});
          assert not bad, f'forbidden runtime dependencies: {bad}'"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.80.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - run: cargo check --locked --all-targets
