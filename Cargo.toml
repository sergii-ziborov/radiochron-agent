[package]
name = "radiochron-agent"
description = "Lightweight RadioChron collector daemon with durable offline spool and MQTT, OTLP/HTTP, and Prometheus export"
version = "0.3.0"
edition = "2021"
default-run = "radiochron-agent"
rust-version = "1.80"
authors = ["Sergii Ziborov"]
license = "MIT"
readme = "README.md"
homepage = "https://radiochron.com"
repository = "https://github.com/sergii-ziborov/radiochron-agent"
keywords = ["wifi", "bluetooth", "iot", "observability", "diagnostics"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "=2.1.1"
native-tls = "0.2.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
radiochron = { version = "=0.5.0", default-features = false, features = ["status", "record", "history", "connectivity", "ble"] }
radiochron-native-ble = "0.1.0"

[profile.release]
lto = "thin"
strip = true
