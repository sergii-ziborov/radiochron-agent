[package]
name = "radiochron-agent"
description = "Lightweight RadioChron collector daemon with durable offline spool and MQTT, OTLP/HTTP, and Prometheus export"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sergii Ziborov"]
license = "MIT"
repository = "https://github.com/sergii-ziborov/radiochron-agent"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "=2.1.1"
native-tls = "0.2.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
radiochron = { git = "https://github.com/sergii-ziborov/radiochron", rev = "f9208c8", default-features = false, features = ["status", "record", "history", "connectivity"] }

[profile.release]
lto = "thin"
strip = true
