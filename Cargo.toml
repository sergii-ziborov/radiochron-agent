[package]
name = "radiochron-agent"
description = "Lightweight RadioChron collector daemon with durable offline spool and MQTT, OTLP/HTTP, and Prometheus export"
version = "0.2.0"
edition = "2021"
default-run = "radiochron-agent"
rust-version = "1.80"
authors = ["Sergii Ziborov"]
license = "MIT"
readme = "README.md"
homepage = "https://radiochron.com"
repository = "https://github.com/sergii-ziborov/radiochron-agent"
keywords = ["wifi", "bluetooth", "iot", "observability", "diagnostics"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "=2.1.1"
native-tls = "0.2.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
btleplug = "0.11.8"
futures = "0.3"
radiochron = { version = "=0.4.0", default-features = false, features = ["status", "record", "history", "connectivity", "ble"] }
tokio = { version = "1.44", features = ["macros", "rt", "time"] }
uuid = "=1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
# btleplug accepts bluez-async 0.8; 0.8.1+ switched its manifest to edition
# 2024, which Cargo 1.80 cannot parse. Keep the daemon's declared Linux MSRV.
bluez-async = "=0.8.0"

[profile.release]
lto = "thin"
strip = true
